services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ngng_local
      MYSQL_USER: ngng
      MYSQL_PASSWORD: ${NGNG_MYSQL_PASSWORD:?Set NGNG_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${NGNG_MYSQL_ROOT_PASSWORD:?Set NGNG_MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ngng_mysql:/var/lib/mysql
      - ./local/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - ngng_elasticsearch:/usr/share/elasticsearch/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${NGNG_MINIO_ROOT_USER:?Set NGNG_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${NGNG_MINIO_ROOT_PASSWORD:?Set NGNG_MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ngng_minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${NGNG_MINIO_ROOT_USER:?Set NGNG_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${NGNG_MINIO_ROOT_PASSWORD:?Set NGNG_MINIO_ROOT_PASSWORD in .env}
    entrypoint: /bin/sh
    command:
      - -c
      - 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing local/ngng-local && mc anonymous set download local/ngng-local'
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  ngng_mysql:
  ngng_elasticsearch:
  ngng_minio:
